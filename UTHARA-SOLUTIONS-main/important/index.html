  <!-- SEO & Brand Metadata -->
  <meta name="description" content="UTTHARA SOLUTIONS: Production-grade Autonomous AI Operating System for Smart Manufacturing, Digital Twin, Machine Passports, and Industrial IoT Telemetry.">
  <meta name="theme-color" content="#070a0f">

  <!-- External Graphic & Visual Engines -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            dark: '#f1f5f9',
            canvas: '#f8fafc',
            surface: '#ffffff',
            subtle: '#e2e8f0',
            medium: '#cbd5e1',
            bright: '#94a3b8'
          }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Apply saved / system theme before first paint (prevents flash) -->
  <script>
    (function () {
      var stored = null;
      try { stored = localStorage.getItem('utthara-theme'); } catch (e) {}
      var dark = stored === 'dark' || (!stored && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.setAttribute('data-theme', 'dark');
    })();
  </script>

  <!-- Application Bootstrap Initialization -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Render Public Marketing Header
      const pubHeaderElem = document.getElementById('public-header-container');
      if (pubHeaderElem && window.PublicHeader) {
        window.PublicHeader.render(pubHeaderElem);
      }

      // Render SaaS Console Header Shell
      const headerElem = document.getElementById('header-container');
      if (headerElem && window.Header) {
        window.Header.render(headerElem);
      }

      // Render Sidebar Navigation
      const sidebarElem = document.getElementById('sidebar-container');
      if (sidebarElem && window.Nav) {
        window.Nav.render(sidebarElem);
      }

      // Initial Route Dispatch
      window.Router.handleRoute();

      // Log Platform Launch Audit Event
      window.AuditLogger.log('PLATFORM_INIT', 'UTTHARA SOLUTIONS SaaS Operating System Loaded', {
        version: '2.0.0-prompt-02-complete',
        vendor: 'UTTHARA SOLUTIONS'
      });
    });
  </script>
